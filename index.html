<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Tasks"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>My Tasks</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#172033;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 90px}h1{font-size:32px;margin:0 0 4px}small,.muted{color:#778196}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.card{background:white;border-radius:20px;padding:20px;box-shadow:0 3px 20px #1720330a;margin-bottom:18px}.progress{height:8px;background:#e9edf3;border-radius:12px;overflow:hidden;margin-top:15px}.progress>div{height:100%;background:#386cf4;transition:width .2s}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:15px}button,input,select{font:inherit}button{border:0;border-radius:12px;background:#eaf0ff;color:#315ad5;padding:10px 13px;cursor:pointer}button.primary{background:#386cf4;color:white}button.ghost{background:transparent;color:#778196}.toolbar input{min-width:0;flex:1;border:1px solid #e1e5ed;padding:10px;border-radius:12px;background:white}ul{list-style:none;padding:0;margin:0}.task{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #f0f2f6}.task:last-child{border-bottom:0}.task input{width:22px;height:22px;accent-color:#386cf4}.task label{flex:1;overflow-wrap:anywhere}.task.done label{text-decoration:line-through;color:#98a0ae}.task .delete{font-size:20px;padding:3px 9px}.form{display:grid;gap:10px}.form input,.form select{border:1px solid #e1e5ed;border-radius:12px;padding:12px;background:white;width:100%}.form-row{display:flex;gap:8px}.form-row>*{flex:1}.note{font-size:12px;line-height:1.6}.section-title{font-weight:700;margin:0 0 8px}#empty{padding:18px 0;color:#8993a3;text-align:center}</style></head><body><main><header><div><h1>My Tasks</h1><small>今日もひとつずつ。</small></div><span style="font-size:30px">✓</span></header><section class="card"><div class="muted" id="dateHeading"></div><div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><strong id="count" style="font-size:30px">0 / 0</strong><small>完了</small></div><div class="progress"><div id="bar"></div></div></section><div class="toolbar"><button id="prev" aria-label="前日">‹</button><input id="date" type="date" aria-label="表示する日付"><button id="next" aria-label="翌日">›</button><button id="today">今日</button></div><section class="card"><p class="section-title">タスク</p><ul id="tasks"></ul><div id="empty" hidden>タスクはありません</div></section><section class="card"><p class="section-title">タスクを追加</p><form id="form" class="form"><input id="title" placeholder="タスク名" maxlength="120" required><div class="form-row"><select id="repeat" aria-label="繰り返し"><option value="once">この日だけ</option><option value="weekdays">平日（月〜金）</option></select><button class="primary" type="submit">追加</button></div></form><p class="note muted">平日タスクは日付ごとに独立して保存されます。完了したタスクは取り消し線で残ります。</p></section><p class="note muted">データはこのブラウザ内に保存されます。Safariのデータ削除や端末変更で失われる可能性があります。</p></main><script src="app.js"></script></body></html>
